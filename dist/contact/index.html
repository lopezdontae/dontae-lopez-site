        <h1>Dontae Lopez</h1>
        <h2>Who</h2>
        <p>Dontae Lopez is an entrepreneur, researcher, and athlete. He is the founder and CEO of <a href="https://threeum.com">Threeum</a> and the creator of Cyte and Cella. He is also the Creative Director of Muerte Studio, a prospect athlete under Mission Twelve, and part of the Ground Zero series.</p>
        <p>He is originally from Colorado and was born in Colorado Springs.</p>
        <h2>Background</h2>
        <p>Lopez began his career in equity research and operations. His work later expanded into venture investing, company building, and operating roles across emerging technology. That progression brought together finance, research, and systems thinking, first through evaluating companies and technologies, and later through building new ones.</p>
        <p>Over the past several years, his research has focused increasingly on artificial intelligence, quantum information, computing infrastructure, and the design of systems that operate under uncertainty. His project-based evaluation work included outputs from systems developed by OpenAI, Anthropic, NVIDIA, Meta, ElevenLabs, and Lovable. The work has included model training and evaluation, quality assurance, human-preference research, knowledge-base and infrastructure research, adversarial red teaming, data work, code-generation projects, and testing new model capabilities.</p>
        <p>To supplement his professional work, Lopez pursued a self-directed course of study across artificial intelligence, finance, information systems, cybersecurity, quantum information, infrastructure, and organizational design. It included university coursework, executive education, online courses, and professional certifications selected according to the problems he was working to understand. Rather than following a single institutional track, he assembled the technical, financial, and organizational knowledge needed to pursue the systems he envisioned.</p>
        <p>That work now converges at Threeum, where he is building across software, infrastructure, biological computing, and dynamical hardware.</p>
        <h2>Focus</h2>
        <p>He is drawn to the hardest version of everything. The research that has no clear answer yet. The business that has no playbook. The sport that demands everything and negotiates nothing. The challenge is not a byproduct of the work. It is the point.</p>
        <h2>Philosophy</h2>
        <p>He believes the work speaks for itself if you let it. That means taking the time to get it right, resisting the pressure to move fast when the situation calls for patience, and holding the same standard whether anyone is watching or not. The domain does not matter. The discipline does.</p>
